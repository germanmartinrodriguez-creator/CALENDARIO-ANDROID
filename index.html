<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Barcelona</title>

<link rel="manifest" href="manifest.json">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0;text-align:center}

h2{margin:10px}

.controls button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
font-weight:bold;
}

.btn-blue{background:#007bff;color:white}
.btn-green{background:#28a745;color:white}
.btn-orange{background:#ff7b00;color:white}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px}

.day{
padding:14px;
border-radius:10px;
font-weight:bold;
background:#fff;
border:1px solid #ddd;
}

.weekend{background:#ff4d4d;color:white}
.holiday{background:#b30000;color:white}
.vacation{background:#ffe600}
.today{border:3px solid #007bff}

</style>
</head>

<body>

<h2 id="title"></h2>

<div class="controls">
<button class="btn-blue" onclick="prev()">◀</button>
<button class="btn-green" onclick="todayBtn()">Hoy</button>
<button class="btn-blue" onclick="next()">▶</button>
<button class="btn-orange" onclick="yearView()">Ver año</button>
</div>

<div class="grid" id="cal"></div>

<script>

const holidays={
"2026-01-01":"Año Nuevo",
"2026-01-06":"Reyes",
"2026-04-03":"Viernes Santo",
"2026-04-06":"Lunes de Pascua",
"2026-05-01":"Día del Trabajo",
"2026-05-25":"Segunda Pascua",
"2026-06-24":"San Juan",
"2026-08-15":"Asunción",
"2026-09-11":"Diada",
"2026-09-24":"La Mercè",
"2026-10-12":"Fiesta Nacional",
"2026-12-08":"Inmaculada",
"2026-12-25":"Navidad",
"2026-12-26":"San Esteban"
};

let today=new Date(),year=today.getFullYear(),month=today.getMonth();

function render(){
let cal=document.getElementById("cal");
let title=document.getElementById("title");

cal.innerHTML="";
title.innerText=new Date(year,month).toLocaleString('es',{month:'long',year:'numeric'});

let firstDay=new Date(year,month,1).getDay();
let days=new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++)cal.innerHTML+="<div></div>";

for(let d=1;d<=days;d++){
let date=new Date(year,month,d);
let key=date.toISOString().split('T')[0];

let div=document.createElement("div");
div.className="day";
div.innerText=d;

if(date.getDay()==0||date.getDay()==6)div.classList.add("weekend");
if(holidays[key])div.classList.add("holiday");

let estado=localStorage.getItem(key);

if(estado==="vacation")div.classList.add("vacation");
if(estado==="manualHoliday")div.classList.add("holiday");

if(date.toDateString()===today.toDateString())div.classList.add("today");

div.onclick=()=>{
let estado=localStorage.getItem(key);

if(!estado){
div.classList.remove("holiday","vacation");
div.classList.add("vacation");
localStorage.setItem(key,"vacation");
}
else if(estado==="vacation"){
div.classList.remove("vacation");
div.classList.add("holiday");
localStorage.setItem(key,"manualHoliday");
}
else{
div.classList.remove("holiday","vacation");
localStorage.removeItem(key);
}

if(holidays[key]){
alert("Festivo: "+holidays[key]);
}
};

cal.appendChild(div);
}
}

function prev(){month--;if(month<0){month=11;year--;}render();}
function next(){month++;if(month>11){month=0;year++;}render();}
function todayBtn(){year=new Date().getFullYear();month=new Date().getMonth();render();}

function yearView(){
alert("Vista anual simplificada (versión móvil)");
}

render();

</script>

</body>
</html>
