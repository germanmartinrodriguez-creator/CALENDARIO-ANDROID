<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calendario Barcelona</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#c1121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendario Barcelona">
<style>
:root{
  --bg:#eef3f8;--card:#fff;--line:#d6dce6;--txt:#121926;--muted:#5b6678;
  --blue:#0066ff;--green:#16b84e;--orange:#ff7a00;--red:#ff2d2d;--deepred:#b80012;--yellow:#fff200
}
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--txt)}
.app{max-width:520px;margin:0 auto;padding:10px}
.head{background:linear-gradient(180deg,#d7192b 0%,#a90f1d 100%);border-radius:16px;padding:10px;box-shadow:0 5px 18px #0002;text-align:center;color:#fff}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
.brand img{width:48px;height:48px;border-radius:12px;box-shadow:0 2px 8px #0005;background:#fff}
.brand h1{font-size:20px;margin:0;color:#fff;text-shadow:0 1px 2px #0006}
.sub{font-size:12px;color:#ffe5e8;margin-top:2px}
.row{display:flex;gap:7px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:nowrap}
.btn{border:0;border-radius:11px;padding:10px 10px;color:#fff;font-weight:bold;font-size:14px;min-width:0;box-shadow:0 3px 8px #0002}
.prev,.next{background:var(--blue);width:48px}.today{background:var(--green);flex:1}.print{background:var(--orange);flex:1.35}.close{background:#475467}
.monthTitle{text-align:center;font-size:21px;font-weight:bold;text-transform:capitalize;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 3px}.dow{text-align:center;font-weight:bold;color:#344054;font-size:13px;padding:4px 0}
.day{position:relative;min-height:50px;border:1px solid var(--line);border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;box-shadow:0 2px 5px #00000012;overflow:hidden;color:#111827}
.empty{min-height:50px}
.weekend{background:var(--red);color:#fff;border-color:#ff4d4d;box-shadow:0 2px 6px #ff2d2d40}
.holiday{background:var(--deepred)!important;color:#fff!important;border-color:#8f0010!important;box-shadow:0 2px 8px #b800124d}
.vacation{background:var(--yellow)!important;color:#111!important;border-color:#d9c900!important;box-shadow:0 2px 8px #fff20070}
.todayCell{background:var(--blue)!important;color:#fff!important;border-color:#004bd6!important;outline:3px solid #73a7ff;outline-offset:-3px;box-shadow:0 2px 10px #0066ff70}
.past{opacity:.68}.past::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2px solid #111;opacity:.55;transform:rotate(-10deg)}
.legend{display:flex;justify-content:center;gap:12px;font-size:12px;margin:12px 0 0;flex-wrap:wrap;color:#344054;align-items:center}.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px}.d1{background:#0066ff}.d2{background:#ff2d2d}.d3{background:#b80012}.d4{background:#fff200;border:1px solid #d9c900}
.infoBox{margin:11px auto 0;background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:11px 13px;box-shadow:0 4px 15px #00000017;display:none;max-width:500px}.infoBox.show{display:block}.infoTitle{font-weight:bold;font-size:15px;margin-bottom:3px}.infoText{font-size:13px;color:#344054;line-height:1.35}.infoHint{font-size:12px;color:#667085;margin-top:5px}
.annual{display:none;max-width:900px;margin:0 auto;padding:10px}.annual h2{text-align:center;margin:6px 0 8px}.annualGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:6px}.mini h3{text-align:center;text-transform:capitalize;margin:0 0 4px;font-size:14px}.miniGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}.miniGrid div{text-align:center;font-size:10px;padding:2px;border-radius:3px;min-height:16px}.mini .dow2{font-weight:bold;color:#555}.miniHoliday{background:#b80012!important;color:#fff!important;font-weight:bold}.miniVacation{background:#fff200!important;color:#111!important;font-weight:bold}.actionsAnnual{text-align:center;margin:8px}.hide{display:none!important}

/* ===== PALETA ULTRA VIVA ===== */
.head{background:linear-gradient(180deg,#e21a2d 0%,#9b0011 100%)!important;border:1px solid #7a0010!important}
.day{min-height:54px!important;border-radius:12px!important;border:1px solid #cfd7e3!important;box-shadow:0 3px 8px #0000001f!important;font-size:18px!important}
.weekend{background:linear-gradient(180deg,#ff4a4a 0%,#f0182c 100%)!important;color:#fff!important;border-color:#d90016!important;box-shadow:0 4px 10px #f0182c55!important}
.holiday{background:linear-gradient(180deg,#d20c1e 0%,#94000d 100%)!important;color:#fff!important;border-color:#72000a!important;box-shadow:0 4px 12px #94000d70!important}
.vacation{background:linear-gradient(180deg,#fff700 0%,#ffe100 100%)!important;color:#111!important;border-color:#cfb900!important;box-shadow:0 4px 12px #ffe10090!important}
.todayCell{background:linear-gradient(180deg,#1976ff 0%,#004fe8 100%)!important;color:#fff!important;border-color:#003eb8!important;outline:4px solid #82b6ff!important;outline-offset:-4px!important;box-shadow:0 4px 14px #0066ff95!important}
.past{opacity:1!important}.past::after{border-top:3px solid #111!important;opacity:.62!important}
.weekend.past::after,.holiday.past::after,.todayCell.past::after{border-top-color:#fff!important;opacity:.85!important}
.btn{box-shadow:0 4px 10px #0003!important}.prev,.next{background:linear-gradient(180deg,#2b76ff,#004ee8)!important}.today{background:linear-gradient(180deg,#18c75a,#08a842)!important}.print{background:linear-gradient(180deg,#ff8b1a,#ff6500)!important}
.dot{width:13px!important;height:13px!important}.d2{background:#f0182c!important}.d3{background:#94000d!important}.d4{background:#fff000!important}
@media print{body{background:#fff}.app{display:none}.annual{display:block;padding:0}.actionsAnnual{display:none}.annual h2{font-size:18px}.annualGrid{grid-template-columns:repeat(3,1fr);gap:5px}.mini{break-inside:avoid;border-radius:4px;padding:4px}.mini h3{font-size:12px}.miniGrid div{font-size:8px;min-height:12px;padding:1px}@page{size:A4 portrait;margin:7mm}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head">
    <div class="brand"><img src="./icons/icon-192.png?v=ultra3" alt="" onerror="this.src='./icono.png?v=ultra3';this.onerror=null;"><div><h1>Calendario Barcelona</h1><div class="sub">Festivos automáticos · Colores vivos · Toques: vacas / festivo / borrar</div></div></div>
    <div class="row"><button class="btn prev" onclick="prev()">◀</button><button class="btn today" onclick="todayBtn()">Hoy</button><button class="btn next" onclick="next()">▶</button><button class="btn print" onclick="showAnnual(true)">Ver / imprimir</button></div>
  </div>
  <div class="monthTitle" id="title"></div>
  <div class="grid" id="cal"></div>
  <div class="legend"><span><i class="dot d1"></i>Hoy</span><span><i class="dot d2"></i>Fin de semana</span><span><i class="dot d3"></i>Festivo</span><span><i class="dot d4"></i>Vacas</span><span>Toque: vacas → festivo → borrar</span></div>
  <div class="infoBox" id="infoBox"><div class="infoTitle" id="infoTitle"></div><div class="infoText" id="infoText"></div><div class="infoHint" id="infoHint"></div></div>
</div>
<div class="annual" id="annual"><h2 id="annualTitle"></h2><div class="annualGrid" id="annualGrid"></div><div class="actionsAnnual"><button class="btn print" onclick="window.print()">Imprimir A4</button> <button class="btn close" onclick="closeAnnual()">Cerrar</button></div></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let today=new Date(),year=today.getFullYear(),month=today.getMonth();
function pad(n){return String(n).padStart(2,'0')}function key(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function addDays(dt,n){let x=new Date(dt);x.setDate(x.getDate()+n);return x}function ymd(dt){return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function holidayMap(y){let e=easter(y),map={};
  map[`${y}-01-01`]='Año Nuevo';
  map[`${y}-01-06`]='Epifanía del Señor / Reyes';
  map[ymd(addDays(e,-2))]='Viernes Santo';
  map[ymd(addDays(e,1))]='Lunes de Pascua Florida';
  map[`${y}-05-01`]='Día del Trabajo';
  map[ymd(addDays(e,50))]='Lunes de Pascua Granada / Segunda Pascua';
  map[`${y}-06-24`]='San Juan';
  map[`${y}-08-15`]='Asunción de la Virgen';
  map[`${y}-09-11`]='Diada Nacional de Cataluña';
  map[`${y}-09-24`]='La Mercè';
  map[`${y}-10-12`]='Fiesta Nacional de España';
  map[`${y}-11-01`]='Todos los Santos';
  map[`${y}-12-06`]='Día de la Constitución';
  map[`${y}-12-08`]='Inmaculada Concepción';
  map[`${y}-12-25`]='Navidad';
  map[`${y}-12-26`]='San Esteban';
  return map;
}
function holidays(y){return new Set(Object.keys(holidayMap(y)));}
function friendlyDate(y,m,d){return `${d} de ${months[m]} de ${y}`}
function showInfo(title,text,hint){let b=document.getElementById('infoBox');document.getElementById('infoTitle').textContent=title;document.getElementById('infoText').textContent=text;document.getElementById('infoHint').textContent=hint||'';b.classList.add('show');}
function dayInfoText(y,m,d,k,estado){let official=holidayMap(y)[k];
  if(official) return {title:'📅 '+friendlyDate(y,m,d), text:'Festivo: '+official, hint:'Festivo oficial. Tocar no cambia este festivo.'};
  if(estado==='manualHoliday') return {title:'📅 '+friendlyDate(y,m,d), text:'Festivo manual', hint:'Toca otra vez para borrar la marca.'};
  if(estado==='vacation') return {title:'📅 '+friendlyDate(y,m,d), text:'Vacaciones marcadas', hint:'Toca otra vez para convertirlo en festivo manual.'};
  return {title:'📅 '+friendlyDate(y,m,d), text:'Día sin marca especial', hint:'1 toque: vacaciones · 2º toque: festivo manual · 3º toque: borrar'};
}
function getManualState(k){
  // Compatibilidad con versiones anteriores: si ya tenías vacaciones guardadas, se conservan.
  let estado=localStorage.getItem('mark_'+k);
  if(estado) return estado;
  if(localStorage.getItem('vac_'+k)==='1'||localStorage.getItem(k)==='1') return 'vacation';
  return '';
}
function setManualState(k,estado){
  localStorage.removeItem('vac_'+k);
  localStorage.removeItem(k);
  if(estado) localStorage.setItem('mark_'+k,estado);
  else localStorage.removeItem('mark_'+k);
}
function rotateDay(k){
  let estado=getManualState(k);
  if(!estado) setManualState(k,'vacation');          // 1 toque: vacaciones
  else if(estado==='vacation') setManualState(k,'manualHoliday'); // 2 toque: festivo manual
  else setManualState(k,'');                         // 3 toque: borrar marca manual
}
function isVacation(k){return getManualState(k)==='vacation'}
function isManualHoliday(k){return getManualState(k)==='manualHoliday'}
function isPast(dt){let t=new Date();t.setHours(0,0,0,0);let d=new Date(dt);d.setHours(0,0,0,0);return d<t}
function render(){document.getElementById('annual').style.display='none';document.getElementById('app').classList.remove('hide');let cal=document.getElementById('cal'),title=document.getElementById('title');cal.innerHTML='';title.textContent=`${months[month]} ${year}`;['L','M','X','J','V','S','D'].forEach(x=>{let e=document.createElement('div');e.className='dow';e.textContent=x;cal.appendChild(e)});let first=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),hol=holidays(year);for(let i=0;i<first;i++){let e=document.createElement('div');e.className='empty';cal.appendChild(e)}for(let d=1;d<=days;d++){let dt=new Date(year,month,d),k=key(year,month,d),div=document.createElement('div');div.className='day';div.textContent=d;if(dt.getDay()==0||dt.getDay()==6)div.classList.add('weekend');
let estado=getManualState(k);
let officialHoliday=hol.has(k);
if(estado==='manualHoliday'||(!estado&&officialHoliday))div.classList.add('holiday');
if(estado==='vacation')div.classList.add('vacation');
if(ymd(dt)===ymd(new Date()))div.classList.add('todayCell');
if(isPast(dt))div.classList.add('past');
div.onclick=()=>{
  if(officialHoliday && !getManualState(k)){
    let info=dayInfoText(year,month,d,k,'');
    showInfo(info.title,info.text,info.hint);
    return;
  }
  rotateDay(k);
  render();
  let estadoNuevo=getManualState(k);
  let info=dayInfoText(year,month,d,k,estadoNuevo);
  showInfo(info.title,info.text,info.hint);
};
cal.appendChild(div)}}
function prev(){month--;if(month<0){month=11;year--}render()}function next(){month++;if(month>11){month=0;year++}render()}function todayBtn(){let t=new Date();year=t.getFullYear();month=t.getMonth();render()}
function buildMini(y,m){let hol=holidays(y),days=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,box=document.createElement('div');box.className='mini';box.innerHTML=`<h3>${months[m]}</h3>`;let g=document.createElement('div');g.className='miniGrid';['L','M','X','J','V','S','D'].forEach(x=>{let e=document.createElement('div');e.className='dow2';e.textContent=x;g.appendChild(e)});for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){let k=key(y,m,d),e=document.createElement('div');e.textContent=d;let estado=getManualState(k);
if(estado==='manualHoliday'||(!estado&&hol.has(k)))e.className='miniHoliday';
if(estado==='vacation')e.className=(e.className+' miniVacation').trim();
g.appendChild(e)}box.appendChild(g);return box}
function showAnnual(doPrint){document.getElementById('app').classList.add('hide');let a=document.getElementById('annual'),g=document.getElementById('annualGrid');document.getElementById('annualTitle').textContent='Calendario Laboral Barcelona '+year;g.innerHTML='';for(let m=0;m<12;m++)g.appendChild(buildMini(year,m));a.style.display='block';if(doPrint)setTimeout(()=>{},100)}function closeAnnual(){document.getElementById('annual').style.display='none';document.getElementById('app').classList.remove('hide')}render();
</script>
</body>
</html>
